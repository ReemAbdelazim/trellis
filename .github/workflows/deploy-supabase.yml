name: Deploy database & functions

# Optional: applies new migrations and deploys Edge Functions to your Supabase
# project whenever supabase/ changes on main. Skipped unless these secrets exist
# (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN   from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    the "abcd1234" in https://abcd1234.supabase.co
#   SUPABASE_DB_PASSWORD    the database password chosen when creating the project

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip != 'true'
        with:
          version: latest
      - name: Link project
        if: steps.cfg.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply migrations
        if: steps.cfg.outputs.skip != 'true'
        run: supabase db push
      - name: Deploy functions
        if: steps.cfg.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
